<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin giảng viên - Khoa Toán HUSC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Header + menu: sửa trong js/layout.js -->
    <script src="../js/layout.js" data-part="header"></script>

<main id="main-content">
    <div class="lecturer-profile-wrapper">
        <h2 class="page-main-title">THÔNG TIN GIẢNG VIÊN</h2>
        <div class="title-underline"></div>
        
        <div class="profile-top-section">
            <div class="profile-left">
                <div class="profile-img-box">
                    <img id="gv-image" alt="Ảnh giảng viên">
                </div>
                <h4 id="gv-name-sidebar" class="profile-name-under">---</h4>
            </div>

            <div class="profile-right">
                <div class="profile-grid-sub">
                    
                    <div class="info-column">
                        <h5 class="sub-header-blue">Thông tin</h5>
                        <ul class="info-list">
                            <li class="info-item">
                                <i class="fas fa-user"></i>
                                <p><strong>Họ và tên:</strong> <span id="gv-fullname">---</span></p>
                            </li>
                            <li class="info-item">
                                <i class="fas fa-venus-mars"></i>
                                <p><strong>Giới tính:</strong> <span id="gv-gender">---</span></p>
                            </li>
                            <li class="info-item">
                                <i class="fas fa-calendar-alt"></i>
                                <p><strong>Năm sinh:</strong> <span id="gv-birthday">---</span></p>
                            </li>
                            <li class="info-item" style="margin-top: 10px;">
                                <i class="fas fa-phone-alt"></i>
                                <p><strong>Điện thoại:</strong> <span id="gv-phone">---</span></p>
                            </li>
                            <li class="info-item">
                                <i class="fas fa-envelope"></i>
                                <p><strong>Email:</strong> <a href="#" id="gv-email">---</a></p>
                            </li>
                        </ul>

                        <h5 class="sub-header-blue" style="margin-top: 35px;">Chuyên môn</h5>
                        <div class="specialty-content">
                            <h6 class="spec-title">1. Lĩnh vực nghiên cứu</h6>
                            <ul id="gv-research-list" class="dot-list-small"></ul>
                            
                            <h6 class="spec-title">2. Kinh nghiệm giảng dạy</h6>
                            <ul id="gv-teaching-list" class="dot-list-small"></ul>
                            
                            <h6 class="spec-title">3. Dữ liệu khoa học</h6>
                            <div class="science-link-wrapper">
                                <a id="gv-science-link" href="#" target="_blank" class="view-more-blue">
                                    <i class="fas fa-external-link-alt" style="margin-right: 8px;"></i> 
                                    Xem chi tiết dữ liệu khoa học của giảng viên
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="edu-column">
                        <h5 class="sub-header-blue">Quá trình đào tạo</h5>
                        <div id="gv-education-list" class="edu-list">
                            </div>
                    </div>

                </div> 
            </div> 
        </div> 
    </div> 
</main>

    <!-- Chân trang: sửa trong js/layout.js -->
    <script src="../js/layout.js" data-part="footer"></script>
    <script src="../js/app.js"></script>
</body>
</html>
